<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>液体物理パーティクルシミュレーション</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col items-center p-2">
<h1 class="text-xl font-bold text-blue-300 mt-3 mb-1">液体物理パーティクルシミュレーション</h1>
<p class="text-gray-400 text-xs mb-2">マウスドラッグで液体を動かそう。クリックで新しいパーティクルを生成。</p>

<!-- Controls bar -->
<div class="flex flex-wrap gap-2 justify-center mb-2 text-xs">
  <div class="bg-gray-800 rounded px-2 py-1 flex items-center gap-1">
    <span class="text-gray-300">モード:</span>
    <button id="modeAttract" aria-label="引き寄せモード" class="mode-btn bg-blue-700 px-2 py-0.5 rounded font-bold">引き寄せ</button>
    <button id="modeRepel" aria-label="斥力モード" class="mode-btn bg-gray-600 px-2 py-0.5 rounded">斥力</button>
  </div>
  <div class="bg-gray-800 rounded px-2 py-1 flex items-center gap-1">
    <span class="text-gray-300">色:</span>
    <button aria-label="色: 水色" data-color="0" class="colorBtn w-5 h-5 rounded-full bg-blue-400 border-2 border-white"></button>
    <button aria-label="色: 赤" data-color="1" class="colorBtn w-5 h-5 rounded-full bg-red-400 border-2 border-transparent"></button>
    <button aria-label="色: 緑" data-color="2" class="colorBtn w-5 h-5 rounded-full bg-green-400 border-2 border-transparent"></button>
  </div>
  <div class="bg-gray-800 rounded px-2 py-1 flex items-center gap-1">
    <span class="text-gray-300">重力:</span>
    <input type="range" id="gravSlider" min="0" max="8" value="4" step="0.5" aria-label="重力強度" class="w-20">
    <span id="gravVal" class="text-yellow-300 w-6">0.4</span>
  </div>
  <div class="bg-gray-800 rounded px-2 py-1 flex items-center gap-1">
    <span class="text-gray-300">数:</span>
    <input type="range" id="countSlider" min="50" max="500" value="300" step="50" aria-label="パーティクル数" class="w-20">
    <span id="countVal" class="text-yellow-300 w-8">300</span>
  </div>
  <button id="resetBtn" aria-label="リセット" class="bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded font-bold">リセット</button>
  <button id="pauseBtn" aria-label="一時停止" class="bg-indigo-700 hover:bg-indigo-600 px-2 py-1 rounded font-bold">一時停止</button>
</div>

<canvas id="simCanvas" aria-label="液体シミュレーションキャンバス" class="rounded-lg border border-blue-900 cursor-crosshair block" style="touch-action:none;"></canvas>

<div class="mt-2 text-xs text-gray-500 flex gap-4">
  <span>パーティクル数: <span id="pCount" class="text-blue-300">0</span></span>
  <span>FPS: <span id="fpsVal" class="text-green-300">60</span></span>
</div>

<script>
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');

// Responsive canvas sizing
function resizeCanvas() {
  const maxW = Math.min(window.innerWidth - 16, 800);
  const maxH = Math.min(window.innerHeight - 200, 500);
  canvas.width = Math.max(300, maxW);
  canvas.height = Math.max(200, maxH);
}
resizeCanvas();
window.addEventListener('resize', () => { resizeCanvas(); initParticles(); });

const COLORS = [
  { h: 210, s: 90, l: 65 },  // blue
  { h: 0, s: 85, l: 65 },    // red
  { h: 140, s: 75, l: 55 },  // green
];

let particles = [];
let gravity = 0.4;
let mode = 'attract'; // 'attract' | 'repel'
let currentColor = 0;
let mouse = { x: -9999, y: -9999, down: false };
let paused = false;
let targetCount = 300;

function makeParticle(x, y, colorIdx) {
  const angle = Math.random() * Math.PI * 2;
  const spd = Math.random() * 2 + 0.5;
  return {
    x: x ?? Math.random() * canvas.width,
    y: y ?? Math.random() * canvas.height * 0.6,
    vx: Math.cos(angle) * spd,
    vy: Math.sin(angle) * spd - 1,
    r: Math.random() * 3 + 2,
    color: colorIdx ?? Math.floor(Math.random() * 3),
    life: 1
  };
}

function initParticles() {
  particles = [];
  for (let i = 0; i < targetCount; i++) {
    particles.push(makeParticle());
  }
}

function update() {
  const W = canvas.width, H = canvas.height;
  const mouseForceRadius = 80;
  const mouseForceStrength = mode === 'attract' ? 0.4 : -0.5;

  for (const p of particles) {
    // Gravity
    p.vy += gravity * 0.1;

    // Mouse interaction
    if (mouse.down) {
      const dx = mouse.x - p.x;
      const dy = mouse.y - p.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < mouseForceRadius && dist > 0.1) {
        const force = (mouseForceRadius - dist) / mouseForceRadius * mouseForceStrength;
        p.vx += (dx / dist) * force;
        p.vy += (dy / dist) * force;
      }
    }

    // Simple neighbor repulsion (surface tension effect, check every few frames)
    // Skip for performance - rely on boundary bounce

    // Damping
    p.vx *= 0.99;
    p.vy *= 0.99;

    // Speed limit
    const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
    if (speed > 10) { p.vx = p.vx / speed * 10; p.vy = p.vy / speed * 10; }

    p.x += p.vx;
    p.y += p.vy;

    // Boundary bounce
    if (p.x < p.r) { p.x = p.r; p.vx = Math.abs(p.vx) * 0.6; }
    if (p.x > W - p.r) { p.x = W - p.r; p.vx = -Math.abs(p.vx) * 0.6; }
    if (p.y < p.r) { p.y = p.r; p.vy = Math.abs(p.vy) * 0.4; }
    if (p.y > H - p.r) { p.y = H - p.r; p.vy = -Math.abs(p.vy) * 0.5; p.vx *= 0.92; }
  }

  // Simple collision (only nearby pairs using spatial hash approximation)
  // For performance, do a simplified O(n) sweep
  const bucketSize = 20;
  const cols = Math.ceil(canvas.width / bucketSize);
  const rows = Math.ceil(canvas.height / bucketSize);
  const buckets = new Map();

  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    const bx = Math.floor(p.x / bucketSize);
    const by = Math.floor(p.y / bucketSize);
    const key = by * cols + bx;
    if (!buckets.has(key)) buckets.set(key, []);
    buckets.get(key).push(i);
  }

  for (const [key, bucket] of buckets) {
    // Check within bucket and adjacent
    for (let bi = 0; bi < bucket.length; bi++) {
      for (let bj = bi + 1; bj < bucket.length; bj++) {
        const a = particles[bucket[bi]], b = particles[bucket[bj]];
        const dx = b.x - a.x, dy = b.y - a.y;
        const minDist = a.r + b.r;
        const dist2 = dx * dx + dy * dy;
        if (dist2 < minDist * minDist && dist2 > 0.01) {
          const dist = Math.sqrt(dist2);
          const overlap = (minDist - dist) / 2;
          const nx = dx / dist, ny = dy / dist;
          a.x -= nx * overlap; a.y -= ny * overlap;
          b.x += nx * overlap; b.y += ny * overlap;
          // Velocity exchange
          const dvx = b.vx - a.vx, dvy = b.vy - a.vy;
          const dot = dvx * nx + dvy * ny;
          if (dot < 0) {
            const impulse = dot * 0.7;
            a.vx += impulse * nx; a.vy += impulse * ny;
            b.vx -= impulse * nx; b.vy -= impulse * ny;
          }
        }
      }
    }
  }
}

function draw() {
  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = 'rgba(5,5,20,0.4)';
  ctx.fillRect(0, 0, W, H);

  for (const p of particles) {
    const c = COLORS[p.color];
    const alpha = 0.75 + Math.sqrt(p.vx * p.vx + p.vy * p.vy) * 0.04;
    const lightness = c.l + Math.min(20, Math.sqrt(p.vx * p.vx + p.vy * p.vy) * 3);

    const grd = ctx.createRadialGradient(p.x - p.r * 0.3, p.y - p.r * 0.3, 0, p.x, p.y, p.r);
    grd.addColorStop(0, `hsla(${c.h},${c.s}%,${lightness + 20}%,${alpha})`);
    grd.addColorStop(1, `hsla(${c.h},${c.s}%,${c.l - 10}%,${alpha * 0.6})`);

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = grd;
    ctx.fill();
  }

  // Mouse cursor indicator
  if (mouse.down) {
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, 80, 0, Math.PI * 2);
    ctx.strokeStyle = mode === 'attract' ? 'rgba(100,180,255,0.3)' : 'rgba(255,100,100,0.3)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

let lastTime = performance.now();
let frameCount = 0;
let fps = 60;

function loop() {
  const now = performance.now();
  frameCount++;
  if (now - lastTime >= 1000) {
    fps = frameCount;
    frameCount = 0;
    lastTime = now;
    document.getElementById('fpsVal').textContent = fps;
    document.getElementById('pCount').textContent = particles.length;
  }

  if (!paused) {
    update();
    draw();
  }
  requestAnimationFrame(loop);
}

// Mouse / touch events
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  if (e.touches && e.touches.length > 0) {
    return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
  }
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

canvas.addEventListener('mousedown', e => {
  const pos = getPos(e);
  mouse.x = pos.x; mouse.y = pos.y; mouse.down = true;
  // Add particle on click
  for (let i = 0; i < 5; i++) {
    if (particles.length < 600) particles.push(makeParticle(pos.x + (Math.random()-0.5)*20, pos.y + (Math.random()-0.5)*20, currentColor));
  }
});
canvas.addEventListener('mousemove', e => {
  const pos = getPos(e);
  mouse.x = pos.x; mouse.y = pos.y;
});
canvas.addEventListener('mouseup', () => { mouse.down = false; });
canvas.addEventListener('mouseleave', () => { mouse.down = false; });

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const pos = getPos(e);
  mouse.x = pos.x; mouse.y = pos.y; mouse.down = true;
  for (let i = 0; i < 5; i++) {
    if (particles.length < 600) particles.push(makeParticle(pos.x + (Math.random()-0.5)*20, pos.y + (Math.random()-0.5)*20, currentColor));
  }
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const pos = getPos(e);
  mouse.x = pos.x; mouse.y = pos.y;
}, { passive: false });
canvas.addEventListener('touchend', () => { mouse.down = false; });

// Controls
document.getElementById('modeAttract').addEventListener('click', function() {
  mode = 'attract';
  this.classList.add('bg-blue-700'); this.classList.remove('bg-gray-600');
  document.getElementById('modeRepel').classList.remove('bg-red-700'); document.getElementById('modeRepel').classList.add('bg-gray-600');
});
document.getElementById('modeRepel').addEventListener('click', function() {
  mode = 'repel';
  this.classList.add('bg-red-700'); this.classList.remove('bg-gray-600');
  document.getElementById('modeAttract').classList.remove('bg-blue-700'); document.getElementById('modeAttract').classList.add('bg-gray-600');
});

document.querySelectorAll('.colorBtn').forEach(btn => {
  btn.addEventListener('click', function() {
    currentColor = parseInt(this.dataset.color);
    document.querySelectorAll('.colorBtn').forEach(b => b.classList.remove('border-white'));
    this.classList.add('border-white');
  });
});

document.getElementById('gravSlider').addEventListener('input', function() {
  gravity = parseFloat(this.value) / 10;
  document.getElementById('gravVal').textContent = gravity.toFixed(1);
});

document.getElementById('countSlider').addEventListener('input', function() {
  targetCount = parseInt(this.value);
  document.getElementById('countVal').textContent = targetCount;
  while (particles.length > targetCount) particles.pop();
  while (particles.length < targetCount) particles.push(makeParticle());
});

document.getElementById('resetBtn').addEventListener('click', initParticles);

document.getElementById('pauseBtn').addEventListener('click', function() {
  paused = !paused;
  this.textContent = paused ? '再開' : '一時停止';
  this.classList.toggle('bg-indigo-700', !paused);
  this.classList.toggle('bg-yellow-700', paused);
});

initParticles();
loop();
</script>
</body>
</html>
